<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Trading Journal</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    .card {
      background: #1a1d27; border: 1px solid #2a2d3e;
      border-radius: 16px; padding: 40px; width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .logo { font-size: 1.8rem; font-weight: 700; color: #4ade80; text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #555; font-size: 0.88rem; margin-bottom: 32px; }

    .tabs { display: flex; margin-bottom: 28px; border-bottom: 1px solid #2a2d3e; }
    .tab {
      flex: 1; text-align: center; padding: 10px;
      cursor: pointer; color: #666; font-size: 0.9rem;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .tab.active { color: #4ade80; border-bottom-color: #4ade80; font-weight: 600; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .form-group input {
      width: 100%; background: #0f1117; border: 1px solid #2a2d3e;
      border-radius: 8px; color: #e0e0e0; padding: 12px 14px;
      font-size: 0.95rem; outline: none; transition: border 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus { border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,0.1); }

    .btn {
      width: 100%; padding: 13px; background: #4ade80; color: #0f1117;
      font-weight: 700; font-size: 1rem; border: none; border-radius: 8px;
      cursor: pointer; transition: all 0.2s; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: #22c55e; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,222,128,0.3); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { background: #2a2d3e; color: #555; cursor: not-allowed; transform: none; box-shadow: none; }

    .spinner {
      width: 16px; height: 16px; border: 2px solid #0f1117;
      border-top-color: transparent; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { background: #3a1a1a; color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; border-left: 3px solid #f87171; }
    .success { background: #14532d; color: #4ade80; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; border-left: 3px solid #4ade80; }

    .divider { text-align: center; color: #333; font-size: 0.8rem; margin: 20px 0 0; }
  </style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="logo">📈 Trading Journal</div>
    <div class="subtitle">Track your trades. Understand your behavior.</div>

    <div class="tabs">
      <div class="tab" :class="{ active: mode === 'login' }" @click="mode = 'login'; error = ''; success = ''">Login</div>
      <div class="tab" :class="{ active: mode === 'register' }" @click="mode = 'register'; error = ''; success = ''">Register</div>
    </div>

    <div v-if="error" class="error">⚠ {{ error }}</div>
    <div v-if="success" class="success">✓ {{ success }}</div>

    <div class="form-group">
      <label>Username</label>
      <input v-model="username" type="text" placeholder="Enter your username" @keyup.enter="submit" autofocus />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input v-model="password" type="password" placeholder="Enter your password" @keyup.enter="submit" />
    </div>

    <button class="btn" @click="submit" :disabled="loading">
      <div v-if="loading" class="spinner"></div>
      <span>{{ loading ? 'Please wait...' : (mode === 'login' ? 'Login' : 'Create Account') }}</span>
    </button>

    <div class="divider">{{ mode === 'login' ? 'New here? Click Register above.' : 'Already have an account? Click Login above.' }}</div>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return { mode: 'login', username: '', password: '', error: '', success: '', loading: false }
  },
  methods: {
    async submit() {
      this.error = ''; this.success = '';
      if (!this.username || !this.password) { this.error = 'Please fill in all fields.'; return; }
      if (this.password.length < 4) { this.error = 'Password must be at least 4 characters.'; return; }
      this.loading = true;
      try {
        const endpoint = this.mode === 'login' ? '/auth/login' : '/auth/register';
        const res = await fetch(`${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: this.username, password: this.password })
        });
        const data = await res.json();
        if (!res.ok) {
          this.error = data.detail || 'Something went wrong.';
        } else {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('username', this.username);
          window.location.href = '/dashboard';
        }
      } catch (e) {
        this.error = 'Cannot connect to server. Is it running?';
      }
      this.loading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
